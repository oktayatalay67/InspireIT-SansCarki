<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>InspireIT Şans Çarkı</title>
<script src="https://cdn.jsdelivr.net/npm/qrcodejs@1.0.0/qrcode.min.js"></script>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  html, body { height: 100%; overflow: hidden; }
  body {
    background: radial-gradient(circle at 50% 30%, #1e293b, #0f172a 70%);
    color: #fff;
    display: grid;
    grid-template-rows: auto 1fr auto;
    height: 100vh;
  }

  header {
    display: grid;
    grid-template-columns: 250px 1fr 200px;
    align-items: start;
    padding: 20px 40px;
    gap: 20px;
  }
  .logo-area img { height: 70px; display: block; margin-top: 10px; margin-left: 20px; }

  .qr-area {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 8px;
    margin-top: 10px;
    margin-right: 20px;
  }
  .qr-box {
    background: #fff;
    padding: 8px;
    border-radius: 10px;
    box-shadow: 0 6px 24px rgba(245,158,11,0.5);
    animation: qrPulse 2s ease-in-out infinite;
  }
  @keyframes qrPulse {
    0%,100% { box-shadow: 0 6px 24px rgba(245,158,11,0.5); }
    50% { box-shadow: 0 6px 40px rgba(245,158,11,1); }
  }
  .qr-tagline {
    font-size: 0.95rem;
    font-weight: 800;
    background: linear-gradient(90deg, #fbbf24, #ef4444, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    letter-spacing: 0.5px;
    text-align: center;
    line-height: 1.3;
    animation: tagPulse 1.5s ease-in-out infinite;
  }
  @keyframes tagPulse {
    0%,100% { opacity: 1; }
    50% { opacity: 0.75; }
  }

  /* ORTA: Çark tam ortada */
  main {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    overflow: hidden;
  }

  .wheel-wrap {
    position: relative;
    width: min(72vh, 72vw);
    height: min(72vh, 72vw);
  }
  .wheel-wrap canvas { width: 100%; height: 100%; display: block; filter: drop-shadow(0 10px 50px rgba(245,158,11,0.5)); }
  .pointer {
    position: absolute;
    top: -22px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 26px solid transparent;
    border-right: 26px solid transparent;
    border-top: 52px solid #fbbf24;
    z-index: 10;
    filter: drop-shadow(0 4px 8px rgba(0,0,0,0.7));
  }
  .center-btn {
    position: absolute;
    top: 50%;
    left: 50%;
    transform: translate(-50%,-50%);
    width: 150px;
    height: 150px;
    border-radius: 50%;
    background: radial-gradient(circle at 30% 30%, #fbbf24, #ef4444);
    border: 6px solid #fff;
    color: #fff;
    font-weight: 900;
    font-size: 1.1rem;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 5px 40px rgba(239,68,68,0.8);
    z-index: 5;
    text-align: center;
    line-height: 1.15;
    animation: pulse 2s ease-in-out infinite;
  }
  @keyframes pulse {
    0%,100% { box-shadow: 0 5px 40px rgba(239,68,68,0.8); }
    50% { box-shadow: 0 5px 70px rgba(239,68,68,1); }
  }

  /* Slogan çarkın altında */
  .slogan-below {
    position: absolute;
    bottom: 20px;
    left: 0;
    right: 0;
    text-align: center;
    font-size: 1.3rem;
    font-weight: 700;
    color: #fbbf24;
    text-shadow: 0 2px 10px rgba(0,0,0,0.5);
    letter-spacing: 1px;
  }

  /* Alt bant: sol HOŞ GELDİNİZ, sağ MESAJ */
  footer {
    display: grid;
    grid-template-columns: 1fr 1fr;
    gap: 20px;
    padding: 14px 40px 20px;
    border-top: 1px solid rgba(255,255,255,0.06);
    min-height: 130px;
  }

  .welcome-box {
    background: linear-gradient(135deg, rgba(59,130,246,0.15), rgba(139,92,246,0.15));
    border: 2px solid rgba(59,130,246,0.4);
    border-radius: 16px;
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
  }
  .welcome-box .greet {
    font-size: 1.6rem;
    font-weight: 800;
    background: linear-gradient(90deg, #60a5fa, #a855f7);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .welcome-box .sub {
    color: #94a3b8;
    font-size: 0.95rem;
    margin-top: 6px;
  }

  .message-box {
    background: linear-gradient(135deg, rgba(245,158,11,0.15), rgba(239,68,68,0.15));
    border: 2px solid rgba(245,158,11,0.4);
    border-radius: 16px;
    padding: 18px 24px;
    display: flex;
    flex-direction: column;
    justify-content: center;
    transition: all 0.4s;
  }
  .message-box.active {
    border-color: #f59e0b;
    box-shadow: 0 0 40px rgba(245,158,11,0.5);
  }
  .message-box .msg {
    font-size: 1.4rem;
    font-weight: 800;
    background: linear-gradient(90deg, #fbbf24, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .message-box .msg-sub {
    color: #cbd5e1;
    font-size: 0.95rem;
    margin-top: 6px;
    line-height: 1.4;
  }
  .message-box .big-result {
    font-size: 2rem;
    font-weight: 900;
    background: linear-gradient(90deg, #10b981, #06b6d4, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    animation: pop 0.6s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }

  /* Konfeti */
  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }
  .confetti i {
    position: absolute;
    width: 12px;
    height: 16px;
    top: -20px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }
</style>
</head>
<body>

<header>
  <div class="logo-area">
    <img src="/logo.png" alt="InspireIT">
  </div>
  <div></div>
  <div class="qr-area">
    <div class="qr-box">
      <div id="qrcode"></div>
    </div>
    <div class="qr-tagline">📱 QR OKUTUN,<br>ÇARKI ÇEVİRİN!</div>
  </div>
</header>

<main>
  <div class="wheel-wrap">
    <div class="pointer"></div>
    <canvas id="wheelCanvas" width="1000" height="1000"></canvas>
    <div class="center-btn">🎡<br>ŞANS<br>ÇARKI</div>
  </div>
  <div class="slogan-below">Şansını Dene, Hediyeni Kap!</div>
</main>

<footer>
  <div class="welcome-box">
    <div class="greet" id="welcomeGreet">👋 Hoş Geldiniz!</div>
    <div class="sub" id="welcomeSub">QR kodu okutarak şansınızı deneyin</div>
  </div>
  <div class="message-box" id="messageBox">
    <div class="msg">🎡 Çark Hazır</div>
    <div class="msg-sub">Katılımcı bekleniyor...</div>
  </div>
</footer>

<script>
const COLOR_BY_TYPE = {
  gift:  ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#f97316','#14b8a6'],
  lose:  ['#334155','#475569','#1e293b','#3f3f46','#52525b'],
  again: ['#0ea5e9','#06b6d4','#0284c7'],
  task:  ['#a855f7','#d946ef','#8b5cf6','#c026d3'],
};
function pickColor(slice, index) {
  const palette = COLOR_BY_TYPE[slice.type] || COLOR_BY_TYPE.gift;
  return palette[index % palette.length];
}

let slices = [];
let standRotation = 0;

// Spin state (animasyon)
let spinning = false;
let spinStart = 0;
let spinDuration = 0;
let spinFrom = 0;
let spinTarget = 0;

function drawWheel(canvas, rotation, activeSlices) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const radius = Math.min(W,H)/2 - 10;
  ctx.clearRect(0,0,W,H);

  const n = activeSlices.length;
  if (n === 0) {
    ctx.fillStyle = '#334155';
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2*Math.PI); ctx.fill();
    return;
  }

  const arc = 2*Math.PI / n;
  for (let i = 0; i < n; i++) {
    const start = rotation + i*arc;
    const end = start + arc;
    const s = activeSlices[i];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = pickColor(s, i);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = W*0.004;
    ctx.stroke();

    const mid = start + arc/2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 6;
    const fontSize = Math.max(W*0.018, Math.min(W*0.030, W*0.35/n + W*0.012));
    ctx.font = `900 ${fontSize}px sans-serif`;
    let txt = s.name;
    const maxChars = n <= 8 ? 26 : n <= 12 ? 20 : 16;
    if (txt.length > maxChars) txt = txt.substring(0, maxChars-1) + '…';
    ctx.fillText(txt, radius*0.95, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, W*0.085, 0, 2*Math.PI);
  ctx.fillStyle = '#0f172a';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = W*0.009;
  ctx.stroke();
}

async function fetchSlices() {
  try {
    const r = await fetch('/api/slices');
    const data = await r.json();
    slices = data.slices || [];
  } catch(e) { console.error(e); }
}

function escapeHtml(s) {
  return String(s).replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
}

// QR — mobil.html
const mobileURL = new URL(window.location.href);
mobileURL.pathname = '/mobil.html';
mobileURL.search = '';
new QRCode(document.getElementById('qrcode'), {
  text: mobileURL.toString(),
  width: 110,
  height: 110,
  colorDark: '#0f172a',
  colorLight: '#ffffff',
  correctLevel: QRCode.CorrectLevel.H
});

// Animasyon döngüsü
function animate() {
  if (spinning) {
    const now = performance.now();
    const t = Math.min((now - spinStart) / spinDuration, 1);
    const eased = 1 - Math.pow(1-t, 3);
    standRotation = spinFrom + (spinTarget - spinFrom) * eased;
    if (t >= 1) {
      spinning = false;
    }
  } else {
    standRotation += 0.0025;
  }
  drawWheel(document.getElementById('wheelCanvas'), standRotation, slices);
  requestAnimationFrame(animate);
}

// Event polling
let lastEventId = 0;
async function pollEvents() {
  try {
    const r = await fetch(`/api/events?since=${lastEventId}`);
    if (r.ok) {
      const data = await r.json();
      if (data.events && data.events.length) {
        for (const ev of data.events) {
          lastEventId = Math.max(lastEventId, ev.id);
          handleEvent(ev);
        }
      }
    }
  } catch(e) {}
  setTimeout(pollEvents, 800);
}

function handleEvent(ev) {
  if (ev.type === 'spin') {
    // 1. Hoş geldin mesajı
    document.getElementById('welcomeGreet').textContent = `👋 Sayın ${ev.name}`;
    document.getElementById('welcomeSub').textContent = 'Bol şanslar dileriz!';

    // 2. Mesaj kutusunu güncelle
    const box = document.getElementById('messageBox');
    box.classList.add('active');
    box.innerHTML = `
      <div class="msg">🎡 Çark Dönüyor...</div>
      <div class="msg-sub">${escapeHtml(ev.name)} için heyecan dorukta!</div>
    `;

    // 3. Çarkı döndür
    triggerSpin(ev.sliceId, ev.sliceType);

    // 4. Sonuç geldiğinde göster (animasyon bitince)
    const delay = spinDuration + 200;
    setTimeout(() => showResult(ev.name, ev.sliceName, ev.sliceType), delay);
  }
}

function triggerSpin(targetSliceId, sliceType) {
  const n = slices.length;
  if (n === 0) return;
  const arc = 2*Math.PI / n;
  let idx = slices.findIndex(s => s.id === targetSliceId);
  if (idx === -1) idx = 0;
  const turns = 5 + Math.floor(Math.random()*3);
  const target = -Math.PI/2 - idx*arc - arc/2 + 2*Math.PI*turns;
  spinFrom = standRotation;
  spinTarget = standRotation + (turns * 2 * Math.PI) + ((target - standRotation) % (2*Math.PI));
  // Basit yaklaşım: hedef dilime döndür
  const targetMod = ((target - standRotation) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  spinTarget = standRotation + turns * 2 * Math.PI + targetMod;
  spinStart = performance.now();
  spinDuration = 5500;
  spinning = true;
}

function showResult(name, sliceName, sliceType) {
  const box = document.getElementById('messageBox');
  let emoji = '🎁';
  if (sliceType === 'gift') emoji = '🎉';
  else if (sliceType === 'lose') emoji = '😢';
  else if (sliceType === 'again') emoji = '🔄';
  else if (sliceType === 'task') emoji = '🎭';

  box.innerHTML = `
    <div class="msg">${emoji} ${escapeHtml(name)}</div>
    <div class="big-result">${escapeHtml(sliceName)}</div>
  `;

  if (sliceType === 'gift') {
    launchConfetti();
  }

  // Stoğu hemen yenile (hediye bitti ise çarktan kalksın)
  fetchSlices();
}

function launchConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti';
  const colors = ['#f59e0b','#ef4444','#10b981','#3b82f6','#8b5cf6','#ec4899','#fbbf24'];
  for (let i = 0; i < 120; i++) {
    const piece = document.createElement('i');
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2 + Math.random()*2) + 's';
    piece.style.animationDelay = (Math.random()*0.5) + 's';
    container.appendChild(piece);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 6000);
}

// Başlat
fetchSlices().then(() => {
  animate();
  pollEvents();
});

setInterval(fetchSlices, 10000);
</script>
</body>
</html>
