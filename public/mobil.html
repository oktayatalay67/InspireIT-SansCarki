<!DOCTYPE html>
<html lang="tr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>InspireIT Şans Çarkı</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
  body {
    background: linear-gradient(180deg, #0f172a, #1e293b);
    color: #fff;
    min-height: 100vh;
    padding: 20px;
  }
  .container { max-width: 500px; margin: 0 auto; }

  .logo-area {
    display: flex;
    justify-content: center;
    margin-bottom: 20px;
    margin-top: 10px;
  }
  .logo-area img { height: 60px; display: block; }

  .card {
    background: rgba(255,255,255,0.04);
    border: 1px solid rgba(255,255,255,0.1);
    border-radius: 24px;
    padding: 28px;
  }

  h1 {
    font-size: 1.5rem;
    text-align: center;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #f59e0b, #ef4444);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    font-weight: 800;
  }
  .lead {
    text-align: center;
    color: #94a3b8;
    font-size: 0.95rem;
    margin-bottom: 24px;
    line-height: 1.4;
  }

  .field { margin-bottom: 16px; }
  .field label {
    display: block;
    font-size: 0.85rem;
    color: #cbd5e1;
    margin-bottom: 6px;
    font-weight: 500;
  }
  .field input {
    width: 100%;
    padding: 14px 16px;
    border-radius: 12px;
    background: rgba(0,0,0,0.3);
    border: 1px solid rgba(255,255,255,0.15);
    color: #fff;
    font-size: 16px;
    outline: none;
    transition: border-color 0.2s;
  }
  .field input:focus { border-color: #f59e0b; }
  .field input.error { border-color: #ef4444; }
  .field .err-msg {
    color: #ef4444;
    font-size: 0.75rem;
    margin-top: 4px;
    display: none;
  }
  .field.error .err-msg { display: block; }

  .check {
    display: flex;
    gap: 12px;
    align-items: flex-start;
    margin-bottom: 12px;
    padding: 12px;
    background: rgba(0,0,0,0.2);
    border-radius: 12px;
  }
  .check input {
    margin-top: 3px;
    transform: scale(1.3);
    accent-color: #f59e0b;
    flex-shrink: 0;
  }
  .check label {
    font-size: 0.82rem;
    color: #cbd5e1;
    line-height: 1.5;
  }

  .submit-btn {
    width: 100%;
    padding: 20px;
    margin-top: 16px;
    border: none;
    border-radius: 16px;
    background: linear-gradient(135deg, #f59e0b, #ef4444);
    color: #fff;
    font-weight: 900;
    font-size: 1.2rem;
    cursor: pointer;
    box-shadow: 0 10px 30px rgba(245,158,11,0.4);
    transition: transform .15s;
    letter-spacing: 0.5px;
  }
  .submit-btn:active { transform: scale(0.97); }
  .submit-btn:disabled { opacity: 0.5; cursor: not-allowed; }

  /* Sonuç */
  #resultScreen { display: none; text-align: center; padding: 20px 0; }
  .emoji-big {
    font-size: 5rem;
    margin: 20px 0;
    animation: pop 0.6s ease-out;
  }
  @keyframes pop {
    0% { transform: scale(0); }
    70% { transform: scale(1.15); }
    100% { transform: scale(1); }
  }
  .result-title {
    font-size: 1.3rem;
    color: #94a3b8;
    margin-bottom: 8px;
    letter-spacing: 1px;
  }
  .result-prize {
    font-size: 2rem;
    font-weight: 900;
    margin: 16px 0;
    background: linear-gradient(90deg, #fbbf24, #ef4444, #8b5cf6);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
    line-height: 1.2;
  }
  .result-sub {
    color: #94a3b8;
    margin-top: 16px;
    font-size: 0.95rem;
    line-height: 1.5;
  }

  .mini-wheel-wrap {
    position: relative;
    width: 280px;
    height: 280px;
    margin: 20px auto;
  }
  .mini-wheel-wrap canvas { width: 100%; height: 100%; }
  .mini-wheel-wrap .pointer {
    position: absolute;
    top: -12px;
    left: 50%;
    transform: translateX(-50%);
    width: 0;
    height: 0;
    border-left: 14px solid transparent;
    border-right: 14px solid transparent;
    border-top: 28px solid #fbbf24;
    z-index: 10;
  }

  .action-btn {
    margin-top: 20px;
    padding: 16px 28px;
    border: none;
    border-radius: 14px;
    background: linear-gradient(135deg, #10b981, #059669);
    color: #fff;
    font-weight: 800;
    font-size: 1rem;
    cursor: pointer;
    box-shadow: 0 8px 24px rgba(16,185,129,0.4);
  }

  .confetti {
    position: fixed;
    inset: 0;
    pointer-events: none;
    z-index: 999;
    overflow: hidden;
  }
  .confetti i {
    position: absolute;
    width: 10px;
    height: 14px;
    top: -20px;
    animation: fall linear forwards;
  }
  @keyframes fall {
    to { transform: translateY(110vh) rotate(720deg); opacity: 0.3; }
  }
</style>
</head>
<body>
<div class="container">

  <div class="logo-area">
    <img src="/logo.png" alt="InspireIT">
  </div>

  <div class="card" id="formCard">
    <h1>🎉 Hoş Geldiniz!</h1>
    <p class="lead">InspireIT Şans Çarkına hoş geldiniz.<br>Lütfen aşağıdaki bilgileri doldurunuz.</p>

    <form id="giftForm" novalidate>
      <div class="field" id="fName">
        <label>Adı Soyadı *</label>
        <input type="text" name="name" required autocomplete="name" placeholder="Adınız Soyadınız">
        <div class="err-msg">Lütfen adınızı ve soyadınızı girin (en az 3 karakter)</div>
      </div>
      <div class="field" id="fCompany">
        <label>Firma Ünvanı *</label>
        <input type="text" name="company" required autocomplete="organization" placeholder="Firma adı">
        <div class="err-msg">Lütfen firma adını girin</div>
      </div>
      <div class="field" id="fPhone">
        <label>GSM Numarası *</label>
        <input type="tel" name="phone" required placeholder="05XX XXX XX XX">
        <div class="err-msg">Geçerli bir telefon numarası girin (10-13 hane)</div>
      </div>
      <div class="field" id="fEmail">
        <label>Email Adresi *</label>
        <input type="email" name="email" required autocomplete="email" placeholder="ornek@firma.com">
        <div class="err-msg">Geçerli bir email adresi girin</div>
      </div>

      <div class="check">
        <input type="checkbox" id="terms" required>
        <label for="terms">Kampanya katılma koşullarını okudum ve kabul ediyorum.</label>
      </div>
      <div class="check">
        <input type="checkbox" id="consent" required>
        <label for="consent">InspireIT A.Ş.'nin yukarıdaki verdiğim bilgilerden bana ulaşmasına izin veriyorum.</label>
      </div>

      <button type="submit" class="submit-btn" id="spinBtn">🎡 ÇARKI ÇEVİR</button>
    </form>
  </div>

  <div class="card" id="resultScreen">
    <div class="mini-wheel-wrap">
      <div class="pointer"></div>
      <canvas id="miniWheelCanvas" width="700" height="700"></canvas>
    </div>
    <div class="emoji-big" id="resultEmoji">🎁</div>
    <div class="result-title" id="resultTitle">-</div>
    <div class="result-prize" id="prizeText">-</div>
    <div class="result-sub" id="resultSub"></div>
    <button class="action-btn" id="actionBtn" style="display:none;"></button>
  </div>

</div>

<script>
const COLOR_BY_TYPE = {
  gift:  ['#ef4444','#f59e0b','#10b981','#3b82f6','#8b5cf6','#ec4899','#f97316','#14b8a6'],
  lose:  ['#334155','#475569','#1e293b','#3f3f46','#52525b'],
  again: ['#0ea5e9','#06b6d4','#0284c7'],
  task:  ['#a855f7','#d946ef','#8b5cf6','#c026d3'],
};
function pickColor(slice, index) {
  const palette = COLOR_BY_TYPE[slice.type] || COLOR_BY_TYPE.gift;
  return palette[index % palette.length];
}

let slices = [];
let participant = null;
let spinLocked = false;

function drawWheel(canvas, rotation, activeSlices) {
  const ctx = canvas.getContext('2d');
  const W = canvas.width, H = canvas.height;
  const cx = W/2, cy = H/2;
  const radius = Math.min(W,H)/2 - 10;
  ctx.clearRect(0,0,W,H);

  const n = activeSlices.length;
  if (n === 0) {
    ctx.fillStyle = '#334155';
    ctx.beginPath(); ctx.arc(cx, cy, radius, 0, 2*Math.PI); ctx.fill();
    return;
  }

  const arc = 2*Math.PI / n;
  for (let i = 0; i < n; i++) {
    const start = rotation + i*arc;
    const end = start + arc;
    const s = activeSlices[i];

    ctx.beginPath();
    ctx.moveTo(cx, cy);
    ctx.arc(cx, cy, radius, start, end);
    ctx.closePath();
    ctx.fillStyle = pickColor(s, i);
    ctx.fill();
    ctx.strokeStyle = 'rgba(255,255,255,0.4)';
    ctx.lineWidth = W*0.004;
    ctx.stroke();

    const mid = start + arc/2;
    ctx.save();
    ctx.translate(cx, cy);
    ctx.rotate(mid);
    ctx.textAlign = 'right';
    ctx.textBaseline = 'middle';
    ctx.fillStyle = '#fff';
    ctx.shadowColor = 'rgba(0,0,0,0.7)';
    ctx.shadowBlur = 6;
    const fontSize = Math.max(W*0.018, Math.min(W*0.030, W*0.35/n + W*0.012));
    ctx.font = `900 ${fontSize}px sans-serif`;
    let txt = s.name;
    const maxChars = n <= 8 ? 26 : n <= 12 ? 20 : 16;
    if (txt.length > maxChars) txt = txt.substring(0, maxChars-1) + '…';
    ctx.fillText(txt, radius*0.95, 0);
    ctx.restore();
  }

  ctx.beginPath();
  ctx.arc(cx, cy, W*0.085, 0, 2*Math.PI);
  ctx.fillStyle = '#0f172a';
  ctx.fill();
  ctx.strokeStyle = '#fff';
  ctx.lineWidth = W*0.009;
  ctx.stroke();
}

function launchConfetti() {
  const container = document.createElement('div');
  container.className = 'confetti';
  const colors = ['#f59e0b','#ef4444','#10b981','#3b82f6','#8b5cf6','#ec4899','#fbbf24'];
  for (let i = 0; i < 80; i++) {
    const piece = document.createElement('i');
    piece.style.left = Math.random()*100 + 'vw';
    piece.style.background = colors[Math.floor(Math.random()*colors.length)];
    piece.style.animationDuration = (2 + Math.random()*2) + 's';
    piece.style.animationDelay = (Math.random()*0.5) + 's';
    container.appendChild(piece);
  }
  document.body.appendChild(container);
  setTimeout(() => container.remove(), 5000);
}

async function fetchSlices() {
  try {
    const r = await fetch('/api/slices');
    const data = await r.json();
    slices = data.slices || [];
  } catch(e) { console.error(e); }
}

// Validasyon
function isValidEmail(email) {
  return /^[^\s@]+@[^\s@]+\.[^\s@]{2,}$/.test(email);
}
function isValidPhone(phone) {
  const d = phone.replace(/\D/g, '');
  return d.length >= 10 && d.length <= 13;
}

function showFieldError(fieldId, show) {
  const el = document.getElementById(fieldId);
  if (show) el.classList.add('error');
  else el.classList.remove('error');
}

const form = document.getElementById('giftForm');
const spinBtn = document.getElementById('spinBtn');

form.addEventListener('submit', async (e) => {
  e.preventDefault();

  const fd = new FormData(form);
  const name = fd.get('name').trim();
  const company = fd.get('company').trim();
  const phone = fd.get('phone').trim();
  const email = fd.get('email').trim();

  let hasError = false;
  showFieldError('fName', name.length < 3);
  if (name.length < 3) hasError = true;
  showFieldError('fCompany', company.length < 2);
  if (company.length < 2) hasError = true;
  showFieldError('fPhone', !isValidPhone(phone));
  if (!isValidPhone(phone)) hasError = true;
  showFieldError('fEmail', !isValidEmail(email));
  if (!isValidEmail(email)) hasError = true;

  if (hasError) return;

  if (!document.getElementById('terms').checked || !document.getElementById('consent').checked) {
    alert('Lütfen onay kutularını işaretleyin.');
    return;
  }

  spinBtn.disabled = true;
  spinBtn.textContent = 'Çark hazırlanıyor...';

  participant = { name, company, phone, email };

  document.getElementById('formCard').style.display = 'none';
  document.getElementById('resultScreen').style.display = 'block';

  await fetchSlices();

  let response;
  try {
    const r = await fetch('/api/spin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(participant)
    });
    response = await r.json();
  } catch(err) {
    alert('Bağlantı hatası, tekrar deneyin.');
    spinBtn.disabled = false;
    spinBtn.textContent = '🎡 ÇARKI ÇEVİR';
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    return;
  }

  if (!response.slice) {
    alert('Hata: ' + (response.error || 'bilinmeyen'));
    spinBtn.disabled = false;
    spinBtn.textContent = '🎡 ÇARKI ÇEVİR';
    document.getElementById('formCard').style.display = 'block';
    document.getElementById('resultScreen').style.display = 'none';
    return;
  }

  const chosen = response.slice;
  if (!participant.id) participant.id = response.participantId;
  if (response.slices) slices = response.slices;

  // Çark animasyonu
  const canvas = document.getElementById('miniWheelCanvas');
  const n = slices.length;
  const arc = 2*Math.PI / n;
  let chosenIndex = slices.findIndex(s => s.id === chosen.id);
  if (chosenIndex === -1) chosenIndex = 0;

  const turns = 5 + Math.floor(Math.random()*3);
  const targetMod = ((-Math.PI/2 - chosenIndex*arc - arc/2) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  const targetRotation = turns * 2 * Math.PI + targetMod;

  const duration = 5500;
  const startTime = performance.now();
  function easeOutCubic(t) { return 1 - Math.pow(1-t, 3); }

  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const rot = targetRotation * easeOutCubic(t);
    drawWheel(canvas, rot, slices);
    if (t < 1) {
      requestAnimationFrame(frame);
    } else {
      spinLocked = false;
      showResult(chosen);
    }
  }
  requestAnimationFrame(frame);
});

function showResult(slice) {
  const emoji = document.getElementById('resultEmoji');
  const title = document.getElementById('resultTitle');
  const prizeText = document.getElementById('prizeText');
  const sub = document.getElementById('resultSub');
  const btn = document.getElementById('actionBtn');

  btn.style.display = 'none';
  btn.onclick = null;

  if (slice.type === 'gift') {
    emoji.textContent = '🎉';
    title.textContent = 'TEBRİKLER!';
    prizeText.textContent = slice.name;
    sub.innerHTML = 'Hediyeniz kaydedildi.<br>Yetkilimiz sizinle iletişime geçecek.';
    launchConfetti();
  } else if (slice.type === 'lose') {
    emoji.textContent = '😢';
    title.textContent = 'ÜZGÜNÜZ...';
    prizeText.textContent = slice.name;
    sub.innerHTML = 'Bu sefer şans yaver gitmedi.<br>Bizi tercih ettiğiniz için teşekkürler!';
  } else if (slice.type === 'again') {
    emoji.textContent = '🔄';
    title.textContent = 'BİR HAK DAHA!';
    prizeText.textContent = slice.name;
    sub.innerHTML = 'Ücretsiz bir çevirme hakkı kazandınız!';
    btn.style.display = 'inline-block';
    btn.className = 'action-btn';
    btn.textContent = '🎡 Tekrar Çevir';
    btn.onclick = () => {
      btn.style.display = 'none';
      document.getElementById('resultEmoji').textContent = '⏳';
      document.getElementById('resultTitle').textContent = 'Çevriliyor...';
      document.getElementById('prizeText').textContent = '';
      document.getElementById('resultSub').innerHTML = '';
      setTimeout(() => repeatSpin(), 300);
    };
  } else if (slice.type === 'task') {
    emoji.textContent = '🎭';
    title.textContent = 'EĞLENCELİ GÖREV!';
    prizeText.textContent = slice.name;
    sub.innerHTML = 'Görevi tamamladıysan butona bas ve ekstra çevirme hakkını kullan!';
    btn.style.display = 'inline-block';
    btn.className = 'action-btn';
    btn.textContent = '✅ Görevi Yaptım → Tekrar Çevir';
    btn.onclick = () => {
      btn.style.display = 'none';
      document.getElementById('resultEmoji').textContent = '⏳';
      document.getElementById('resultTitle').textContent = 'Çevriliyor...';
      document.getElementById('prizeText').textContent = '';
      document.getElementById('resultSub').innerHTML = '';
      setTimeout(() => repeatSpin(), 300);
    };
  }
}

async function repeatSpin() {
  await fetchSlices();
  let response;
  try {
    const r = await fetch('/api/spin', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify(participant)
    });
    response = await r.json();
  } catch(e) { return; }

  if (!response.slice) return;
  const chosen = response.slice;
  if (response.slices) slices = response.slices;

  const canvas = document.getElementById('miniWheelCanvas');
  const n = slices.length;
  const arc = 2*Math.PI / n;
  let chosenIndex = slices.findIndex(s => s.id === chosen.id);
  if (chosenIndex === -1) chosenIndex = 0;
  const turns = 5;
  const targetMod = ((-Math.PI/2 - chosenIndex*arc - arc/2) % (2*Math.PI) + 2*Math.PI) % (2*Math.PI);
  const targetRotation = turns * 2 * Math.PI + targetMod;
  const duration = 5500;
  const startTime = performance.now();
  function easeOutCubic(t) { return 1 - Math.pow(1-t, 3); }
  function frame(now) {
    const t = Math.min((now - startTime) / duration, 1);
    const rot = targetRotation * easeOutCubic(t);
    drawWheel(canvas, rot, slices);
    if (t < 1) requestAnimationFrame(frame);
    else showResult(chosen);
  }
  requestAnimationFrame(frame);
}

fetchSlices();
</script>
</body>
</html>
